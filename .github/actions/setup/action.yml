name: "Setup Python and uv"
description: >-
  Set up Python and uv (with caching), then optionally sync uv dependency
  groups from the committed uv.lock. Assumes the repository is already checked
  out (a local composite action cannot run before checkout).

  The sync is `--locked`: it installs exactly what uv.lock pins and fails if
  the lock is stale relative to pyproject.toml, so CI is reproducible and a
  forgotten `uv lock` surfaces here rather than as a mystery failure in an
  unrelated PR.

inputs:
  python-version:
    description: "Python version to install."
    required: false
    default: "3.12"
  groups:
    description: >-
      Space-separated uv dependency groups to sync (e.g. "dev integration").
      An empty string skips the sync (e.g. for `uv build`, which needs no venv).
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        # Stated rather than inherited: the default flipped from true to false in
        # setup-uv v9, so leaving it implicit means a routine major bump silently
        # stops pruning and starts caching pre-built wheels that are usually
        # faster to rebuild on GitHub-hosted runners than to restore.
        prune-cache: true

    - name: Sync dependencies
      if: ${{ inputs.groups != '' }}
      shell: bash
      env:
        GROUPS: ${{ inputs.groups }}
      run: |
        args=()
        for group in $GROUPS; do
          args+=(--group "$group")
        done
        uv sync --locked "${args[@]}"
